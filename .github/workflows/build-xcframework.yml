name: Build XCFramework

on:
  push:
    tags:
      - '*'  # Triggers on any tag push (covers both git push and GitHub UI tag creation)

jobs:
  build-xcframework:
    name: Build and Release XCFramework
    runs-on: macos-latest
    timeout-minutes: 60  # Prevent hanging builds
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
      
      - name: Extract version from tag
        id: tag_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Tag version: $VERSION"
          else
            echo "Error: Not a tag ref: ${{ github.ref }}"
            exit 1
          fi
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Verify Xcode setup
        run: |
          xcodebuild -version
          xcrun --version
          swift --version
      
      - name: Build XCFramework
        id: build
        run: |
          chmod +x .github/scripts/build-xcframework.sh
          .github/scripts/build-xcframework.sh "${{ steps.tag_version.outputs.version }}"
        env:
          FRAMEWORK_NAME: CryptoSwift
          SCHEME_NAME: CryptoSwift
      
      - name: Verify build artifacts
        run: |
          ZIP_FILE="./build/CryptoSwift/CryptoSwift.xcframework.zip"
          XCFRAMEWORK_DIR="./build/CryptoSwift/CryptoSwift.xcframework"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: XCFramework zip file not found at $ZIP_FILE"
            exit 1
          fi
          
          if [ ! -d "$XCFRAMEWORK_DIR" ]; then
            echo "Error: XCFramework directory not found at $XCFRAMEWORK_DIR"
            exit 1
          fi
          
          # Verify zip file is not empty
          ZIP_SIZE=$(stat -f%z "$ZIP_FILE" 2>/dev/null || stat -c%s "$ZIP_FILE" 2>/dev/null)
          if [ "$ZIP_SIZE" -lt 1000 ]; then
            echo "Error: XCFramework zip file appears to be empty or too small ($ZIP_SIZE bytes)"
            exit 1
          fi
          
          echo "✅ Build artifacts verified"
          echo "Zip size: $ZIP_SIZE bytes"
      
      - name: Get checksum from build script
        id: build_output
        run: |
          CHECKSUM_FILE="./build/CryptoSwift/checksum.txt"
          if [ -f "$CHECKSUM_FILE" ]; then
            CHECKSUM=$(cat "$CHECKSUM_FILE")
            echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
            echo "Checksum: $CHECKSUM"
          else
            echo "Warning: Checksum file not found, computing now..."
            CHECKSUM=$(swift package compute-checksum ./build/CryptoSwift/CryptoSwift.xcframework.zip)
            echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
            echo "Checksum: $CHECKSUM"
          fi
      
      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.tag_version.outputs.version }}"
          # Check if release exists for this tag using GitHub API
          RELEASE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}")
          
          if [ "$RELEASE_EXISTS" = "200" ]; then
            echo "⚠️  Error: Release for tag $VERSION already exists!"
            echo ""
            echo "To create a new release, please use a new version tag:"
            echo "  - If last release was 1.7.1, use 1.7.2"
            echo "  - If last release was 1.7.2, use 1.7.3"
            echo "  - Or use semantic versioning: 1.8.0, etc."
            echo ""
            echo "Example:"
            echo "  git tag 1.7.2"
            echo "  git push origin 1.7.2"
            exit 1
          else
            echo "✅ No existing release found for tag $VERSION - proceeding with release creation"
          fi
        continue-on-error: false
      
      - name: Create Release and Upload XCFramework
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.version }}
          name: Release ${{ steps.tag_version.outputs.version }}
          body: |
            Pre-built XCFramework for CryptoSwift ${{ steps.tag_version.outputs.version }}
            
            ## XCFramework
            - **File**: CryptoSwift.xcframework.zip
            ${{ steps.build_output.outputs.checksum != '' && '            - **Checksum**: `' || '' }}${{ steps.build_output.outputs.checksum }}${{ steps.build_output.outputs.checksum != '' && '`' || '' }}
            
            Built with Library Evolution enabled for binary distribution.
          files: |
            ./build/CryptoSwift/CryptoSwift.xcframework.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
